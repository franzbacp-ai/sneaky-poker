<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Poker Club</title>
<!-- Open Graph / Discord preview -->
<meta name="description" content="No Limit Hold'em – play with friends">
<meta property="og:title" content="Poker Club – NL Hold'em">
<meta property="og:description" content="Join the table and play No Limit Texas Hold'em">
<meta property="og:type" content="website">
<meta property="og:image" content="/preview.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Poker Club – NL Hold'em">
<meta name="twitter:description" content="Join the table and play No Limit Texas Hold'em">
<link rel="stylesheet" href="/style.css">
<script src="/socket.io/socket.io.js"></script>
<script src="/i18n.js"></script>
</head>
<body>

<audio id="snd-shuffle" src="sounds/shuffle.mp3"></audio>
<audio id="snd-chips"   src="sounds/chips.mp3"></audio>
<audio id="snd-win"     src="sounds/win.mp3"></audio>
<audio id="snd-check"   src="sounds/check.mp3"></audio>
<audio id="snd-allin"   src="sounds/allin.mp3"></audio>

<div id="reenter-overlay">
  <h1>BUSTED</h1>
  <div style="color:#5a7a9a;font-size:.95rem;letter-spacing:2px">You ran out of chips</div>
  <button class="btn-reenter" onclick="socket.emit('reenter')">RE-ENTER</button>
</div>
<div id="toast"></div>

<!-- ── Setup ─────────────────────────────────────────────────────────────── -->
<div id="screen-setup">
  <div class="setup-card" id="join-card">
    <h1>POKER CLUB</h1>
    <div class="subtitle">NO LIMIT HOLD'EM</div>
    <input class="setup-input" id="input-name" type="text" placeholder="Your name"
      autocomplete="off" onkeydown="if(event.key==='Enter')joinOrCreate()">
    <input class="setup-input" id="input-lobby-id" type="text"
      placeholder="Lobby ID (leave blank to create new)" autocomplete="off">
    <button class="btn-primary" onclick="joinOrCreate()">PLAY</button>
    <div id="invite-box" class="invite-box" onclick="copyInvite()">Click to copy invite link</div>
  </div>
  <div id="lobby-panel">
    <div id="lobby-status">Waiting for players...</div>
    <div id="lobby-code" onclick="copyLobbyCode()" title="Click to copy"></div>
    <div id="lobby-list"></div>
    <div id="host-ui" style="display:none">
      <div class="settings-row">
        <label>SB</label><input type="number" id="sb" value="0.5" step="0.5" min="0.5">
        <label>BB</label><input type="number" id="bb" value="1.0" step="0.5" min="1">
        <label>STACK</label><input type="number" id="stack" value="100" step="10" min="10">
      </div>
      <button class="btn-primary" onclick="applySettingsAndStart()">START GAME</button>
    </div>
    <button class="btn-leave" onclick="leaveLobby()">LEAVE LOBBY</button>
  </div>
</div>

<!-- ── Game ──────────────────────────────────────────────────────────────── -->
<div id="screen-game">
  <div id="hud">
    <div id="hud-hand">HAND #1</div>
    <div id="hud-phase">LOBBY</div>
    <div id="hud-right">
      <div id="hud-action"></div>
      <button id="lang-btn" onclick="toggleLang()">DE</button>
    </div>
  </div>
  <div id="table-area">
    <div class="poker-table">
      <div class="table-felt-line"></div>
      <div class="pot-area">
        <div class="pot-label">TOTAL POT</div>
        <div class="pot-amount" id="pot-ui">0 BB</div>
        <div class="side-pots-display" id="side-pots-ui"></div>
      </div>
      <div id="board" class="board"></div>
    </div>
    <div id="seats-container"></div>
  </div>
  <div id="controls">
    <button class="ctrl-btn btn-fold"  id="btn-fold"  onclick="act('fold')">FOLD</button>
    <button class="ctrl-btn btn-check" id="btn-call"  onclick="act('call')">CHECK</button>
    <div class="raise-group">
      <div class="bet-slider-wrap">
        <input type="range" class="bet-slider" id="raise-slider"
          min="2" max="200" step="0.5" oninput="syncSlider(this.value)">
      </div>
      <input type="number" id="raise-val" value="4" oninput="syncInput(this.value)">
      <button class="ctrl-btn btn-raise" id="btn-raise" onclick="act('raise')">RAISE</button>
    </div>
    <button class="ctrl-btn btn-allin" id="btn-allin" onclick="act('allin')">ALL-IN</button>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
const socket = io();
let myId = null, lastPhase = '', lastPotValue = 0;
let playerLastActions = {}, _lastToastMsg = '';
const params = new URLSearchParams(location.search);
const MASTER = params.get('master');

// ── Language toggle ───────────────────────────────────────────────────────────
let _lastState = null;
function toggleLang() {
  const next = getLang() === 'en' ? 'de' : 'en';
  setLang(next);
  document.getElementById('lang-btn').textContent = next === 'en' ? 'DE' : 'EN';
  if (_lastState) renderSeats(_lastState);
}

// ── Sound ─────────────────────────────────────────────────────────────────────
function playSound(id) {
  const s = document.getElementById(id);
  if (s) { s.currentTime = 0; s.play().catch(() => {}); }
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let _toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 3800);
}

// ── Invite link ───────────────────────────────────────────────────────────────
let _inviteUrl = '';
function showInviteBox(lobbyId) {
  _inviteUrl = `${location.origin}/lobby/${lobbyId}`;
  const box = document.getElementById('invite-box');
  box.style.display = 'block';
  box.textContent = _inviteUrl;
}
function copyInvite() {
  navigator.clipboard.writeText(_inviteUrl).then(() => showToast('Copied! \uD83D\uDCCB'));
}
function copyLobbyCode() {
  const code = document.getElementById('lobby-code').textContent;
  navigator.clipboard.writeText(code).then(() => showToast('Lobby code copied!'));
}
function leaveLobby() {
  localStorage.removeItem('pokerToken');
  localStorage.removeItem('pokerLobby');
  location.reload();
}

// ── Auto-fill lobby from URL ──────────────────────────────────────────────────
window.addEventListener('load', () => {
  const lobbyParam = params.get('lobby');
  if (lobbyParam) {
    document.getElementById('input-lobby-id').value = lobbyParam;
  }
  document.getElementById('lang-btn').textContent = getLang() === 'en' ? 'DE' : 'EN';
  // Auto-reconnect
  const token = localStorage.getItem('pokerToken');
  const lobby = localStorage.getItem('pokerLobby');
  if (token && lobby) socket.emit('joinLobby', { lobbyId: lobby, token, name: '' });
});

// ── Join or create ────────────────────────────────────────────────────────────
function joinOrCreate() {
  const name = document.getElementById('input-name').value.trim();
  if (!name) return;
  let lobbyInput = document.getElementById('input-lobby-id').value.trim();
  if (lobbyInput.includes('/lobby/'))
    lobbyInput = lobbyInput.split('/lobby/')[1].split('?')[0].trim();
  if (lobbyInput) {
    socket.emit('joinLobby', { lobbyId: lobbyInput, name, master: MASTER });
  } else {
    socket.emit('createLobby', { name, master: MASTER, startStack: 100 });
  }
}

socket.on('lobbyCreated', d => {
  if (d.token) localStorage.setItem('pokerToken', d.token);
  localStorage.setItem('pokerLobby', d.lobbyId);
  showInviteBox(d.lobbyId);
  document.getElementById('join-card').style.display = 'none';
  document.getElementById('lobby-panel').style.display = 'block';
});
socket.on('joined', d => {
  if (d.token) localStorage.setItem('pokerToken', d.token);
  localStorage.setItem('pokerLobby', d.lobbyId);
  document.getElementById('join-card').style.display = 'none';
  document.getElementById('lobby-panel').style.display = 'block';
  if (d.queued) showToast('Joined – you will play from next hand');
});
socket.on('reconnected', d => {
  localStorage.setItem('pokerLobby', d.lobbyId);
  document.getElementById('join-card').style.display = 'none';
  document.getElementById('lobby-panel').style.display = 'block';
});
socket.on('error', d => showToast(d.msg || 'Error'));

// ── Settings ──────────────────────────────────────────────────────────────────
function applySettingsAndStart() {
  socket.emit('updateSettings', {
    sb: document.getElementById('sb').value,
    bb: document.getElementById('bb').value,
    startStack: document.getElementById('stack').value,
  });
  socket.emit('startGame');
}

// ── Controls ──────────────────────────────────────────────────────────────────
function syncSlider(v) { document.getElementById('raise-val').value = parseFloat(v).toFixed(1); }
function syncInput(v)  { document.getElementById('raise-slider').value = v; }
function act(type) {
  if (type === 'allin') playSound('snd-allin');
  else if (type === 'call') {
    const lbl = document.getElementById('btn-call').textContent;
    playSound((lbl === 'CHECK' || lbl === 'CHECKEN') ? 'snd-check' : 'snd-chips');
  } else if (type === 'raise') playSound('snd-chips');
  socket.emit('action', { type, amount: document.getElementById('raise-val').value });
}

// ── Card HTML ─────────────────────────────────────────────────────────────────
const SYM = { s: '\u2660', h: '\u2665', d: '\u2666', c: '\u2663' };
function getCard(c, animate) {
  if (!c || c === '??')
    return `<div class="card card-back${animate ? ' card-reveal' : ''}"></div>`;
  const suit = c.slice(-1), rank = c.slice(0, -1);
  const cls = (suit==='h'||suit==='d') ? 'red' : suit==='c' ? 'blue' : '';
  return `<div class="card ${cls}${animate ? ' card-reveal' : ''}">`
       + `<span class="suit-corner">${SYM[suit]||suit}</span>`
       + `${rank}${SYM[suit]||suit}</div>`;
}
function roleBadge(role) {
  if (!role) return '';
  const r = role.toUpperCase();
  if (r==='D/SB') return `<span class="pbox-role role-DSB">D/SB</span>`;
  if (r==='D')    return `<span class="pbox-role role-D">D</span>`;
  if (r==='SB')   return `<span class="pbox-role role-SB">SB</span>`;
  if (r==='BB')   return `<span class="pbox-role role-BB">BB</span>`;
  return '';
}

// ── Chip tower – returns HTML for a vertical stack of chip discs ──────────────
function chipTower(bet, bb) {
  if (!bet || bet <= 0) return '';
  const denoms = [
    [100*bb,'chip-black'],[25*bb,'chip-purple'],[10*bb,'chip-blue'],
    [5*bb,'chip-red'],[1*bb,'chip-green'],[0.01,'chip-gold'],
  ];
  let rem = bet, chips = [];
  for (const [val, cls] of denoms) {
    while (rem >= val - 0.001 && chips.length < 8) { chips.push(cls); rem -= val; }
    if (chips.length >= 8) break;
  }
  return chips.map(c => `<div class="chip ${c}"></div>`).join('');
}

// ── Elliptical seat positioning ───────────────────────────────────────────────
// relIdx=0 → bottom-centre (my seat), clockwise
function seatPos(relIdx, n, rx=44, ry=40) {
  const angle = Math.PI/2 + (2*Math.PI*relIdx/n);
  return {
    left: (50 + rx*Math.cos(angle)).toFixed(2) + '%',
    top:  (50 - ry*Math.sin(angle)).toFixed(2) + '%',
    angle,
  };
}
// Point on ellipse between seat and table centre (for chip tower & role token)
function innerPos(relIdx, n, rx=26, ry=22) {
  const angle = Math.PI/2 + (2*Math.PI*relIdx/n);
  return {
    left: (50 + rx*Math.cos(angle)).toFixed(2) + '%',
    top:  (50 - ry*Math.sin(angle)).toFixed(2) + '%',
  };
}

// ── Role token HTML ───────────────────────────────────────────────────────────
function roleToken(role) {
  if (!role) return '';
  const r = role.toUpperCase();
  const map = { 'D':'D','SB':'SB','BB':'BB','D/SB':'D' };
  const label = map[r] || '';
  if (!label) return '';
  const cls = r==='D/SB' ? 'role-DSB' : r==='D' ? 'role-D' : r==='SB' ? 'role-SB' : 'role-BB';
  return `<div class="role-token ${cls}">${label}</div>`;
}

// ── Render player seats ───────────────────────────────────────────────────────
function renderSeats(s) {
  const cont = document.getElementById('seats-container');
  const queue = s.queue || [];
  const all = [...s.players, ...queue.map(p => ({...p, queued:true}))];
  const myIdx = all.findIndex(p => p.id === myId);
  const n = all.length || 1;
  const bb = s.settings?.bb || 1;

  // Remove stale seats
  const pids = new Set(all.map(p => p.id));
  cont.querySelectorAll('.seat,.bet-area,.role-token').forEach(el => {
    if (!pids.has(el.dataset.pid)) el.remove();
  });

  all.forEach((p, i) => {
    const relIdx = (i - Math.max(myIdx,0) + n) % n;
    const pos  = seatPos(relIdx, n);
    const ipos = innerPos(relIdx, n);

    // ── Player box seat ──
    let seat = cont.querySelector(`.seat[data-pid="${p.id}"]`);
    if (!seat) {
      seat = document.createElement('div');
      seat.className = 'seat'; seat.dataset.pid = p.id;
      cont.appendChild(seat);
    }
    seat.style.left = pos.left;
    seat.style.top  = pos.top;

    const isMe   = p.id === myId;
    const isTurn = s.players[s.currentTurn]?.id === p.id;
    const boxCls = ['player-box',
      isTurn ? 'is-turn' : '',
      p.folded && !p.queued ? 'folded' : '',
      p.isAllIn ? 'is-allin' : '',
      p.queued ? 'queued' : '',
    ].filter(Boolean).join(' ');

    const isMaster = s.masterBoard !== undefined; // master flag inferred from server sending masterBoard
    const cards = (p.cards && p.cards.length)
      ? p.cards.map(c => {
          const isHidden = c === '??' ;
          const dim = !isMe && isMaster && !isHidden && !p.folded;
          return `<div style="${dim ? 'opacity:.7;filter:hue-rotate(180deg) saturate(.7)' : ''}">${getCard(c, false)}</div>`;
        }).join('')
      : '<div class="card card-back"></div><div class="card card-back"></div>';
    const winLine = p.handWinnings > 0
      ? `<div style="font-size:.52rem;color:#4ad87a;font-weight:800">+${p.handWinnings.toFixed(1)}</div>` : '';

    seat.innerHTML = `
      <div class="${boxCls}" id="pb${p.id}">
        <div class="pbox-name">${p.baseName}${isMe ? ' \uD83C\uDFAF' : ''}</div>
        <div class="pbox-stack">${p.outOfChips ? '\uD83D\uDC80' : p.stack.toFixed(1)+' BB'}</div>
        <div class="pbox-cards">${cards}</div>
        <div class="pbox-action">${p.lastAction||''}</div>
        ${winLine}
      </div>
      ${p.queued ? '<div class="queued-badge">Next Hand</div>' : ''}`;

    if (p.handWinnings > 0)
      document.getElementById('pb'+p.id)?.classList.add('winner-glow');

    // ── Chip tower on table (between seat and centre) ──
    let betEl = cont.querySelector(`.bet-area[data-pid="${p.id}"]`);
    if (!betEl) {
      betEl = document.createElement('div');
      betEl.className = 'bet-area'; betEl.dataset.pid = p.id;
      cont.appendChild(betEl);
    }
    betEl.style.left = ipos.left;
    betEl.style.top  = ipos.top;
    betEl.style.transform = 'translate(-50%,-50%)';
    if (!p.queued && p.bet > 0) {
      betEl.innerHTML = `<div class="chip-stack">${chipTower(p.bet, bb)}</div>`
        + `<div class="bet-label">${p.bet.toFixed(1)}</div>`;
      betEl.style.display = '';
    } else {
      betEl.style.display = 'none';
    }

    // ── Role token on table (just inside bet area) ──
    let tokEl = cont.querySelector(`.role-token[data-pid="${p.id}"]`);
    if (p.role && !p.queued) {
      if (!tokEl) {
        tokEl = document.createElement('div');
        tokEl.dataset.pid = p.id;
        cont.appendChild(tokEl);
      }
      const r = p.role.toUpperCase();
      tokEl.className = 'role-token ' + (r==='D/SB'?'role-DSB':r==='D'?'role-D':r==='SB'?'role-SB':'role-BB');
      tokEl.textContent = r==='D/SB'?'D':r;
      // Place slightly closer to centre than chip area
      const tpos = innerPos(relIdx, n, 34, 29);
      tokEl.style.left = tpos.left;
      tokEl.style.top  = tpos.top;
      tokEl.style.transform = 'translate(-50%,-50%)';
    } else if (tokEl) {
      tokEl.remove();
    }
  });
}

// ── Main state update ─────────────────────────────────────────────────────────
socket.on('stateUpdate', s => {
  _lastState = s;
  myId = s.me;
  const all = [...(s.players||[]), ...(s.queue||[])];
  const me = all.find(p => p.id === myId);
  const isHost = s.hostId === myId;

  // Sounds
  if (s.phase !== lastPhase) {
    if (s.phase === 'PREFLOP')  playSound('snd-shuffle');
    if (s.phase === 'SHOWDOWN') playSound('snd-win');
    lastPhase = s.phase;
  }
  if ((s.pot||0) > lastPotValue + 0.01) { playSound('snd-chips'); lastPotValue = s.pot; }
  if (s.pot === 0) lastPotValue = 0;
  (s.players||[]).forEach(p => {
    if (p.lastAction && p.lastAction !== playerLastActions[p.id]) {
      if (p.lastAction === 'Check')   playSound('snd-check');
      if (p.lastAction === 'ALL IN!') playSound('snd-allin');
      playerLastActions[p.id] = p.lastAction;
    }
  });

  // Lobby phase
  if (s.phase === 'LOBBY') {
    document.getElementById('host-ui').style.display = isHost ? 'block' : 'none';
    document.getElementById('lobby-status').textContent =
      `${s.players.length} player${s.players.length!==1?'s':''} in lobby`;
    if (s.id) {
      const codeEl = document.getElementById('lobby-code');
      codeEl.style.display = 'inline-block';
      codeEl.textContent = s.id;
    }
    document.getElementById('lobby-list').innerHTML =
      s.players.map((p,i)=>`<div>${p.baseName}${i===0?' \uD83D\uDC51':''}</div>`).join('');
    return;
  }

  // Game phase – switch screens
  document.getElementById('screen-setup').style.display = 'none';
  document.getElementById('screen-game').style.display  = 'flex';
  document.getElementById('reenter-overlay').style.display =
    (me && me.outOfChips && !s.queued) ? 'flex' : 'none';

  // HUD
  document.getElementById('hud-hand').textContent = `HAND #${s.handNumber||1}`;
  document.getElementById('hud-phase').textContent = s.allInShowdown ? '\u26A1 ALL-IN' : (s.phase||'');
  document.getElementById('hud-action').textContent = s.lastAction || '';

  // Toast on win
  if ((s.phase==='SHOWDOWN'||s.phase==='LOBBY') && s.lastAction && s.lastAction!==_lastToastMsg) {
    showToast(s.lastAction); _lastToastMsg = s.lastAction;
  }

  // Pot
  document.getElementById('pot-ui').textContent = `${(s.pot||0).toFixed(1)} BB`;
  const spEl = document.getElementById('side-pots-ui');
  spEl.innerHTML = (s.sidePots&&s.sidePots.length>1)
    ? s.sidePots.map((sp,i)=>`<div class="side-pot-chip">${i===0?'Main':'Side '+i}: ${sp.amount.toFixed(1)}</div>`).join('')
    : '';

  // Board
  const boardEl = document.getElementById('board');
  const prev = boardEl.children.length;
  const dealt = s.board || [];
  let boardHtml = dealt.map((c,i) => getCard(c, i >= prev)).join('');
  if (s.masterBoard && s.masterBoard.length) {
    // Show remaining community cards dimmed (not yet on the board)
    boardHtml += s.masterBoard.slice(dealt.length).map(c =>
      `<div style="opacity:.35;filter:grayscale(.4)">${getCard(c,false)}</div>`
    ).join('');
  }
  boardEl.innerHTML = boardHtml;

  // Controls
  const amQueued = s.queued === true;
  const myTurn = !amQueued && s.players[s.currentTurn]?.id === myId && !s.allInShowdown;
  ['btn-fold','btn-call','btn-raise','btn-allin','raise-val','raise-slider'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = !myTurn;
  });
  if (me && myTurn) {
    const bb = s.settings?.bb || 1;
    const diff = (s.currentCall||0) - (me.bet||0);
    document.getElementById('btn-call').textContent = diff<=0 ? 'CHECK' : `CALL ${diff.toFixed(1)}`;
    const minR = Math.max((s.currentCall||bb)+bb, bb*2);
    const maxR = (me.stack||0) + (me.bet||0);
    const sl = document.getElementById('raise-slider');
    sl.min = minR; sl.max = maxR;
    if (parseFloat(sl.value) < minR) { sl.value = minR; syncSlider(minR); }
  }

  // Seats
  renderSeats(s);
});
</script>
</body>
</html>
